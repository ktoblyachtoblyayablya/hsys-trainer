<text x="528.0" y="82.99999999999999" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" text-anchor="middle" font-weight="400" fill="#52514e">1 КиБ (float)</text>
<rect x="602" y="50" width="132" height="44" rx="6" fill="#e3f4ea" stroke="#1d7a47" stroke-width="1.4"/>
<text x="668.0" y="68.69999999999999" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" text-anchor="middle" font-weight="600" fill="#0b0b0b">b_tile[16][16]</text>
<text x="668.0" y="82.99999999999999" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="9.5" text-anchor="middle" font-weight="400" fill="#52514e">1 КиБ (float)</text>
<text x="598" y="116" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="400" fill="#52514e">итого 2 КиБ на блок; каждый элемент</text>
<text x="598" y="132" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" font-weight="400" fill="#52514e">из global читается в 16 раз реже</text>
<rect x="450" y="158" width="296" height="150" rx="8" fill="#ffffff" stroke="#8a8986" stroke-width="1.4"/>
<text x="598" y="178" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="700" fill="#0b0b0b">Цикл по плиткам t = 0, 16, 32, …</text>
<text x="462" y="202" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="400" fill="#0b0b0b">1. нить грузит по элементу A и B</text>
<text x="462" y="224" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="400" fill="#0b0b0b">2. __syncthreads() — плитки готовы</text>
<text x="462" y="246" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="400" fill="#0b0b0b">3. 16 умножений-сложений из shared</text>
<text x="462" y="268" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="400" fill="#0b0b0b">4. __syncthreads() — можно перезаписывать</text>
<text x="462" y="290" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" font-weight="400" fill="#0b0b0b">5. t += 16, повторить до конца k</text>
<text x="598" y="334" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="600" fill="#0b0b0b">Блок нитей 16 × 16 = 256 нитей</text>
<text x="598" y="352" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#52514e">считает одну плитку C 16 × 16</text>
<text x="380" y="402" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="400" fill="#52514e">Элементы за границей матриц заменяются нулями, поэтому размеры могут быть любыми (1, 127, 129 …)</text></svg>
